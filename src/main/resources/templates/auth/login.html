<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk | Amana POS</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>

<body class="login-page">
    <main class="login-shell">
        <section class="brand-panel" aria-label="Amana Atelier">
            <div class="editorial-frame">
                <img class="editorial-photo"
                     th:src="@{/uploads/products/735e12caf62d464daae398e9e311dbcd.jpg}"
                     src="/uploads/products/735e12caf62d464daae398e9e311dbcd.jpg"
                     alt="Koleksi pakaian Amana Atelier">
            </div>
            <div class="editorial-caption">
                <p class="brand-statement">Mengelola Toko, dengan Cara yang Lebih Baik.</p>
            </div>
        </section>

        <section class="auth-panel" aria-labelledby="login-heading">
            <div class="auth-content">
                <div th:if="${param.error}" class="feedback error" role="alert">
                    Username atau password salah, atau akun tidak aktif.
                </div>

                <div th:if="${param.logout}" class="feedback success" role="status">
                    Kamu sudah berhasil logout.
                </div>

                <div class="auth-header">
                    <p class="auth-kicker">RUANG KERJA AMANA POS</p>
                    <h1 id="login-heading">Masuk ke <em>Atelier</em></h1>
                    <p class="description">Lanjutkan aktivitas toko Anda dengan lebih tenang.</p>
                </div>

                <form class="login-form" th:action="@{/login}" method="post">
                    <div class="form-group">
                        <label for="username">Nama Pengguna</label>
                        <div class="input-wrap">
                            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <circle cx="12" cy="8" r="4"></circle>
                                <path d="M5 21a7 7 0 0 1 14 0"></path>
                            </svg>
                            <input
                                type="text"
                                id="username"
                                name="username"
                                placeholder="Masukkan nama pengguna"
                                autocomplete="username"
                                required
                                autofocus
                            >
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password">Kata Sandi</label>
                        <div class="input-wrap">
                            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <rect x="4" y="10" width="16" height="11" rx="2"></rect>
                                <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
                            </svg>
                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Masukkan kata sandi"
                                autocomplete="current-password"
                                required
                            >
                        </div>
                    </div>

                    <button type="submit" class="btn-submit">
                        <span>Masuk ke AMANA POS</span>
                        <svg class="btn-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                            <polyline points="12 5 19 12 12 19"></polyline>
                        </svg>
                    </button>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
